<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Panel Campervana{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }
        nav {
            background: #1e293b;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        nav .brand {
            color: white;
            font-weight: bold;
            margin-right: auto;
        }
        nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 15px;
            padding: 6px 10px;
            border-radius: 6px;
        }
        nav a:hover {
            background: #334155;
            color: white;
        }
        nav a.active {
            background: #2d6cdf;
            color: white;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        button, .btn {
            padding: 10px 16px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            background: #2d6cdf;
            color: white;
            cursor: pointer;
        }
        button:hover, .btn:hover {
            background: #1e56c0;
        }
    </style>
</head>
<body>
    <nav>
        <span class="brand">🚐 Panel Campervana</span>
        <a href="/" class="{{ 'active' if active_page == 'todo' else '' }}">📋 To-Do</a>
        <a href="/issues" class="{{ 'active' if active_page == 'issues' else '' }}">🔧 Usterki</a>
        <a href="/logout" style="margin-left: 12px; color: #94a3b8;">Wyloguj</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
