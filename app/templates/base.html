<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Panel Campervana{% endblock %}</title>
    <style>
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            background: #eef2ff;
            color: #111827;
        }
        nav {
            background: #1f2937;
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.12);
        }
        nav .brand {
            color: white;
            font-weight: 700;
            margin-right: auto;
            letter-spacing: 0.02em;
            flex: 1 1 100%;
        }
        nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 15px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
            white-space: nowrap;
        }
        nav a:hover {
            background: #334155;
            color: white;
        }
        nav a.active {
            background: #2563eb;
            color: white;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        .container {
            max-width: 1120px;
            margin: 40px auto 60px;
            padding: 0 24px;
        }
        h1 {
            margin-bottom: 24px;
            font-size: 2.15rem;
            letter-spacing: -0.03em;
        }
        h2 {
            margin: 0 0 18px;
            font-size: 1.1rem;
            color: #111827;
        }
        .panel-grid {
            display: grid;
            gap: 20px;
        }
        .panel-grid.columns-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .panel-grid.columns-2-1 {
            grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
        }
        .panel-grid.columns-1-1 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .section {
            margin-bottom: 44px;
        }
        @media (max-width: 980px) {
            nav {
                padding: 14px 18px;
            }
            .panel-grid.columns-2,
            .panel-grid.columns-2-1,
            .panel-grid.columns-1-1 {
                grid-template-columns: 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .chart-bars {
                overflow-x: auto;
            }
            .chart-bar {
                min-width: 50px;
            }
            .data-table th,
            .data-table td {
                padding: 12px 10px;
            }
        }
        @media (max-width: 720px) {
            body {
                font-size: 15px;
            }
            nav {
                padding: 12px 16px;
            }
            nav .brand {
                flex: 1 1 100%;
                margin-bottom: 8px;
            }
            .container {
                padding: 0 16px;
            }
            .panel-grid.columns-2,
            .panel-grid.columns-2-1,
            .panel-grid.columns-1-1 {
                gap: 18px;
            }
            .input-field,
            .select-field,
            .textarea-field,
            button,
            .btn {
                font-size: 0.95rem;
            }
            .chart-bars {
                gap: 10px;
            }
            .chart-label {
                font-size: 0.78rem;
            }
            .card {
                padding: 22px;
            }
        }
        .card {
            background: white;
            padding: 28px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }
        .form-grid {
            display: grid;
            gap: 16px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .input-field,
        .select-field,
        .textarea-field {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            background: #f8fafc;
            font-size: 0.98rem;
            color: #111827;
            min-width: 0;
        }
        .input-field:focus,
        .select-field:focus,
        .textarea-field:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            background: white;
        }
        button,
        .btn {
            padding: 13px 18px;
            font-size: 0.98rem;
            border: none;
            border-radius: 14px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        button:hover,
        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        .chart-panel {
            position: relative;
            overflow: hidden;
        }
        .chart-axis {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.88rem;
            color: #475569;
            min-height: 220px;
        }
        .chart-bars {
            display: flex;
            align-items: flex-end;
            gap: 14px;
            min-height: 220px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .chart-bar {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            min-width: 60px;
            height: 220px;
        }
        .chart-bar-fill {
            width: 100%;
            background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
            border-radius: 16px 16px 0 0;
            transition: height 0.4s ease;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.18);
        }
        .chart-label {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #475569;
            text-align: center;
            word-break: break-word;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.96rem;
        }
        .data-table th,
        .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
        }
        .data-table thead tr {
            background: #f8fafc;
        }
        .data-table tbody tr:hover {
            background: #f1f5f9;
        }
        .small-text {
            color: #475569;
        }
        .label-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            border-radius: 999px;
            background: #eff6ff;
            color: #1e40af;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <nav>
        <span class="brand">🚐 Panel Campervana</span>
        <a href="/" class="{{ 'active' if active_page == 'home' else '' }}">🏠 Home</a>
        <a href="/todo" class="{{ 'active' if active_page == 'todo' else '' }}">💡 Pomysły</a>
        <a href="/issues" class="{{ 'active' if active_page == 'issues' else '' }}">🔧 To-Do</a>
        <a href="/finanse" class="{{ 'active' if active_page == 'finanse' else '' }}">💰 Finanse</a>
        <a href="/deadlines" class="{{ 'active' if active_page == 'deadlines' else '' }}">⏰ Terminy</a>
        <a href="/gallery" class="{{ 'active' if active_page == 'gallery' else '' }}">🖼️ Galeria</a>
        <a href="/logout" style="margin-left: 12px; color: #94a3b8;">Wyloguj</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
