{% extends "base.html" %}
{% block title %}Wydatek{% endblock %}
{% block content %}
    <h1>✏️ Karta wydatku</h1>
    <form action="/expenses/card/{{ expense.id }}" method="post" style="display:grid; gap:16px; background:white; padding:20px; border-radius:12px; box-shadow:0 1px 10px rgba(0,0,0,0.08);">
        <label style="font-weight:700;">Tytuł</label>
        <input type="text" name="title" value="{{ expense.title }}" style="width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;">

        <label style="font-weight:700;">Kwota</label>
        <input type="text" name="amount" value="{{ expense.amount }}" style="width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;">

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div>
                <label style="font-weight:700; display:block; margin-bottom:8px;">Kategoria</label>
                <select name="category" style="width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;">
                    {% for category in categories %}
                    <option value="{{ category }}" {% if expense.category == category %}selected{% endif %}>{{ category_labels[category] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label style="font-weight:700; display:block; margin-bottom:8px;">Data</label>
                <input type="date" name="expense_date" value="{{ expense.expense_date }}" style="width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;">
            </div>
        </div>

        <label style="font-weight:700;">Notatka</label>
        <textarea name="note" rows="4" style="width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;">{{ expense.note }}</textarea>

        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
            <button type="submit" style="padding:12px 20px; background:#2563eb; color:white; border:none; border-radius:8px; cursor:pointer;">Zapisz</button>
            <a href="/finanse" style="color:#2563eb; text-decoration:none;">← Powrót do Finanse</a>
        </div>
    </form>
{% endblock %}
